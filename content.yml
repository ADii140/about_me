me:
  name: "Adrian"
  kicker: "> ssh adrian@krakow — connected"
  headline: "I'm Adrian. I keep systems <em>boring</em> so the interesting parts stay interesting."
  lede: "Off the clock I'm somewhere on a bike, deep in video games, or rewriting the same Python script for the fourth time because version three offended me."
  actions:
    - { label: "ping me", href: "#hello" }

story_heading: "bio.log"
story:
  - "I was the kid who took things apart to see whether they'd go back together, and who was quietly more interested in the taking-apart. That never really changed — I just found an industry that pays for it."
  - "The route here wasn't planned. Nearly a decade of engineering at one company, then a jump into cloud and reliability work at another, and somewhere in the middle the realisation that the part I actually loved was removing the reason a problem existed rather than fixing the problem again. That's the whole job description, more or less: notice the thing everyone has quietly accepted as normal, and refuse to accept it."
  - "I'm a generalist by instinct: I'd rather borrow an idea from an unrelated field than perfect one I already know. Ask me about error budgets, why most alerts are noise, cyberpunk as a genre that got uncomfortably accurate, or the economics of a virtual auction house. I'll take any of those for an hour."

likes_heading: "likes[]"
likes:
  - "books — Ziemianski first, then everything that followed"
  - "Kraków in November, when the tourists have gone"
  - "Rise Against, loud, ideally live"
  - "mountain bike trails that are slightly beyond my skill level"
  - "optimising an in-game economy for gold I will never spend"
  - "\"it depends\" — my most-used and least-helpful phrase"

lately_heading: "now.feed"
lately:
  - { label: "reading", text: "Gibson's Sprawl Trilogy again. Neuromancer holds up; the sequels are better than people admit." }
  - { label: "listening", text: "Rise Against on repeat, plus whatever Spotify decides I need." }
  - { label: "learning", text: "Python, properly this time — building small things I can actually put on the internet." }
  - { label: "gaming", text: "World of Warcraft, mostly. Restoration Shaman in my heart forever - esepecially the one from WotLK!" }

hello_heading: "ping()"
hello_note: "I like getting email from strangers. If any of this overlapped with something of yours — reliability work, a  goode novel to read or even better game to play — tell me about it."

